<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A1A45">
<title>L'enquête de la mascotte</title>
<style>
:root{
  --nuit:#2A1A45;
  --nuit-2:#3B2763;
  --papier:#F6F1FF;
  --banane:#FFC93C;
  --banane-fonce:#E6A800;
  --citrouille:#F26B1D;
  --vert:#2FAE62;
  --encre:#1E1233;
  --gris:#5E5278;
  --rouge:#B83247;
  --doux:#CFC4EA;
  --fond-haut:#2A1A45;
  --fond-bas:#2A1A45;
  --halo:transparent;
  --fond-image:linear-gradient(transparent,transparent);
  --decor-couleur:#0b1220;
  --coin-carte:#F6F1FF;
  --police:"Avenir Next Rounded","Arial Rounded MT Bold",ui-rounded,"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--fond-bas);background-image:var(--fond-image),linear-gradient(180deg,var(--fond-haut),var(--fond-bas) 70%);background-attachment:fixed;background-repeat:repeat,no-repeat;color:var(--papier);font:18px/1.45 var(--police);min-height:100vh;min-height:100dvh;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 82% 6%,var(--halo),transparent 46%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1}
.wrap{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(30px,9vw,42px);line-height:1.04;font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--banane);outline-offset:3px;border-radius:8px}

/* En-tête : lieu + poste, puis progression sur toute la largeur */
.entete{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.entete .ligne{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.entete .parc{font-weight:700;color:var(--accent-entete,var(--banane));font-size:17px;min-width:0}
.entete .poste{font-size:15px;color:var(--doux);margin:0;white-space:nowrap}
.progression{display:flex;gap:6px;width:100%}
.progression > span{flex:1 1 0;min-width:0;display:block}
.progression svg{width:100%;height:auto;display:block}

/* Cartes */
.carte{background:var(--papier);color:var(--encre);border-radius:22px;padding:20px;margin-bottom:16px}
.carte p+p{margin-top:10px}
.carte h2{margin-bottom:6px}
.carte .petit{font-size:15px;color:var(--gris)}

/* Avis de recherche (poster de départ) */
.avis{background:var(--papier);color:var(--encre);border-radius:6px;padding:22px 20px 20px;margin:0 0 18px;transform:rotate(-1.2deg);box-shadow:0 10px 0 -4px rgba(0,0,0,.25);text-align:center;position:relative}
.avis::before,.avis::after{content:"";position:absolute;top:10px;width:12px;height:12px;border-radius:50%;background:var(--citrouille)}
.avis::before{left:12px}.avis::after{right:12px}
.avis h1{color:var(--encre);margin-bottom:6px}
.avis .sous{font-weight:700;color:var(--citrouille);font-size:17px}
.avis .portrait{position:relative;width:170px;margin:10px auto 6px}
.avis .portrait img{width:100%;height:auto;display:block;filter:grayscale(.85) contrast(.9);opacity:.85}
.avis .tampon{position:absolute;right:-14px;bottom:10px;transform:rotate(-12deg);border:3px solid var(--rouge);color:var(--rouge);background:rgba(255,255,255,.85);border-radius:8px;padding:2px 10px;font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase}

/* Témoignage = page de carnet */
.temoignage{background:#FFFBE8;color:var(--encre);border-radius:6px 22px 22px 6px;padding:18px 20px 18px 28px;margin-bottom:16px;position:relative;border-left:6px solid var(--citrouille)}
.temoignage .qui{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:6px}
.temoignage .qui span.ico{font-size:30px;line-height:1}
.temoignage .cite{font-size:20px;line-height:1.35;margin:0}

/* Énigme = ticket jaune */
.enigme{background:var(--banane);color:var(--encre);border-radius:22px;padding:20px;margin-bottom:16px}
.enigme h2{margin-bottom:8px}
.enigme .texte{font-size:20px;font-weight:700;line-height:1.35}
.enigme .consigne{margin-top:12px;font-size:16px;font-weight:600}
.indice{margin-top:12px;background:rgba(255,255,255,.55);border-radius:14px;padding:12px 14px;font-weight:700}

/* Boutons */
.bouton{appearance:none;border:0;cursor:pointer;width:100%;min-height:56px;padding:14px 18px;border-radius:16px;font:inherit;font-weight:800;font-size:18px;background:var(--encre);color:var(--papier);margin-top:14px}
.bouton.clair{background:rgba(255,255,255,.7);color:var(--encre)}
.bouton.ok{background:var(--banane);color:var(--encre)}
.bouton[disabled]{opacity:.45;cursor:not-allowed}
.bouton:active:not([disabled]){transform:translateY(1px)}

/* Suspects */
.suspects{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
.suspect{appearance:none;border:3px solid transparent;background:#fff;color:var(--encre);border-radius:18px;padding:10px 8px 12px;font:inherit;text-align:center;cursor:pointer}
.suspect svg{width:84px;height:84px;display:block;margin:0 auto 4px}
.suspect .nom{font-weight:800;font-size:16px;line-height:1.15}
.suspect[aria-pressed="true"]{border-color:var(--citrouille);background:#FFF1E6;box-shadow:0 0 0 3px rgba(242,107,29,.25)}
.erreur{margin-top:12px;background:#FDE8EB;color:#7A1626;border-radius:14px;padding:12px 14px;font-weight:700}

/* Victoire */
.victoire{text-align:center;position:relative;overflow:hidden}
.victoire .singe{width:170px;height:auto;margin:6px auto 0;display:block;animation:rebond .9s cubic-bezier(.3,1.6,.5,1) both}
.victoire h1{margin:4px 0 8px}
.mot{background:var(--encre);color:var(--banane);border-radius:20px;padding:16px;margin-top:16px}
.mot .jour{font-size:15px;color:var(--doux)}
.mot .le-mot{font-size:clamp(30px,10vw,44px);font-weight:800;letter-spacing:.04em;line-height:1.1;margin:4px 0}
.mot .heure{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;color:var(--papier)}
.avertissement{font-size:15px;color:var(--gris);margin-top:12px}
.pluie{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.victoire > *:not(.pluie){position:relative;z-index:1}
.pluie svg{position:absolute;top:-40px;width:34px;height:22px;opacity:.9;animation:chute ease-in 1 both}
@keyframes chute{to{transform:translateY(900px) rotate(240deg);opacity:0}}
@keyframes rebond{from{transform:scale(.3) translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  .victoire .singe{animation:none}
  .pluie{display:none}
}

.temoignage.verrouille{background:transparent;color:var(--doux);border:2px dashed rgba(255,255,255,.4);border-radius:14px;padding:14px 18px}
.temoignage.verrouille .qui{margin-bottom:0}
.marque{display:block;width:120px;height:auto;margin:0 auto 12px}
.bandeau{display:block;width:100%;height:auto;border-radius:22px;margin:0 0 16px;border:3px solid rgba(255,255,255,.18)}
.decor{position:fixed;top:0;left:0;right:0;height:120px;pointer-events:none;z-index:0;overflow:hidden}
.decor svg{position:absolute;fill:var(--decor-couleur);opacity:var(--decor-opacite,.75)}
.victoire .bandeau{margin:0 0 12px;border-radius:16px}
.fanions .wrap{padding-top:calc(max(16px,env(safe-area-inset-top)) + 36px)}

/* Pied de page */
.pied{margin-top:22px;font-size:14px;color:var(--doux);text-align:center}
</style>
</head>

    if(k === "class") e.className = props[k];
    else if(k === "text") e.textContent = typo(props[k]);
    else if(k === "html") e.innerHTML = props[k];   // uniquement pour les SVG internes
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  });
  (kids || []).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}

/* ---------- Date et heure (toujours à l'heure de Paris) ---------- */
var params = new URLSearchParams(location.search);
var TEST = params.get("test") === "1";
function parisDate(){
  var o = params.get("date");
  if(TEST && /^\d{4}-\d{2}-\d{2}$/.test(o || "")) return o;
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}
function dayIndex(dateStr){
  var a = dateStr.split("-").map(Number), b = DATA.periode.debut.split("-").map(Number);
  return Math.round((Date.UTC(a[0],a[1]-1,a[2]) - Date.UTC(b[0],b[1]-1,b[2])) / 86400000);
}
function motDuJour(dateStr){
  var n = DATA.mots.length, i = dayIndex(dateStr);
  return DATA.mots[((i % n) + n) % n];
}
function coupableDuJour(parcId, dateStr){      // MÊME formule que build.py (coupable_du_jour)
  var ids = DATA.suspectsListe, n = ids.length, i = dayIndex(dateStr);
  return ids[(((DATA.parcs[parcId].depart + i) % n) + n) % n];
}
function temoinsDuJour(parcId, dateStr){
  var parc = DATA.parcs[parcId], textes = parc.variantes[coupableDuJour(parcId, dateStr)];
  return parc.etapes.slice(1,5).map(function(e, k){ return {icone:e.temoin.icone, nom:e.temoin.nom, texte:textes[k]}; });
}
/* Témoins déjà interrogés aujourd'hui sur ce téléphone (clé enquete-vu-<parc> = « date|2,3 ») */
function stockageOk(){
  try{ localStorage.setItem("enquete-test","1"); localStorage.removeItem("enquete-test"); return true; }catch(e){ return false; }
}
function lireVus(parcId, jour){
  if(!stockageOk()) return {ok:false, vus:[]};
  var v = ""; try{ v = localStorage.getItem("enquete-vu-"+parcId) || ""; }catch(e){}
  var m = v.split("|");
  return {ok:true, vus:(m[0] === jour && m[1]) ? m[1].split(",").map(Number) : []};
}
function noterVu(parcId, jour, poste){
  var l = lireVus(parcId, jour);
  if(!l.ok) return;
  if(l.vus.indexOf(poste) < 0) l.vus.push(poste);
  try{ localStorage.setItem("enquete-vu-"+parcId, jour+"|"+l.vus.join(",")); }catch(e){}
}
function dateLongue(dateStr){
  return new Intl.DateTimeFormat("fr-FR",{timeZone:"UTC",weekday:"long",day:"numeric",month:"long"}).format(new Date(dateStr + "T12:00:00Z"));
}
function heureParis(){
  return new Intl.DateTimeFormat("fr-FR",{timeZone:"Europe/Paris",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date());
}

  var parc = DATA.parcs[parcId], v = {m:DATA.mascotte};

  temoinsDuJour(parcId, jour).forEach(function(t, k){

  });

      el("p",{text:fmt(DATA.recits.verrou,{postes:manque.join(", ")})}),

      choix = sid;

      go.removeAttribute("disabled");
      erreur.hidden = true;
    });
    cartes[sid] = b;
    grille.appendChild(b);
  });

  var verrou = false;
  go.addEventListener("click", function(){
    if(!choix || verrou) return;
    if(choix === coupableDuJour(parcId, parisDate())){
      try{ localStorage.setItem("enquete-gagne-"+parcId, parisDate()+"|"+choix); }catch(e){}
      ecranVictoire(parcId, choix);
      return;
    }
    erreur.textContent = typo(fmt(DATA.recits.mauvaise, v));
    erreur.hidden = false;
    verrou = true;
    var n = 5;
    go.setAttribute("disabled","disabled");
    go.textContent = "Réessayer dans " + n + " s";
    var t = setInterval(function(){
      n--;
      if(n <= 0){
        clearInterval(t); verrou = false;
        go.textContent = "Désigner le coupable";
        if(choix) go.removeAttribute("disabled");
      } else go.textContent = "Réessayer dans " + n + " s";
    }, 1000);
  });

  var carteChoix = el("section",{"class":"carte"},[
    el("h2",{text:"Qui est le coupable ?"}), grille, erreur, go

}

/* ---------- Démarrage ---------- */
function demarrer(){
  var jour = parisDate();
  var token = params.get("e");
  if(!TEST){
    if(jour < DATA.periode.debut){ messageSimple("Un mystère se prépare…", DATA.messages.avant, true); return; }
    if(jour > DATA.periode.fin){ messageSimple("Merci, détectives !", DATA.messages.apres, false); return; }
  }
  if(!token){ messageSimple(DATA.titre, DATA.messages.sans_code, true); return; }
  var t = DATA.tokens[token];
  if(!t){ messageSimple("QR code non reconnu", DATA.messages.code_inconnu, false); return; }
  appliquerTheme(t.p);
  var deja = null;
  try{ deja = localStorage.getItem("enquete-gagne-"+t.p); }catch(e){}
  if(t.s === 6 && deja){
    var morceaux = deja.split("|");
    if(morceaux[0] === jour && DATA.suspects[morceaux[1]]){ ecranVictoire(t.p, morceaux[1]); return; }
  }
  ecranEtape(t.p, t.s);
}
demarrer();
})();
</script>
